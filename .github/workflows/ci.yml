name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  # The build lane: restores the shared cache, never saves it. On a merge-group
  # entry whose cache missed, it hands its target directory to main as an
  # artifact instead.
  build:
    if: github.event_name != 'push'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: probe-raw
          cache-workspace-crates: true
          save-if: false
      - name: build and test
        run: cargo test --locked -v
      - name: archive build state
        if: &state-wanted github.event_name == 'merge_group' && steps.rust-cache.outputs.cache-hit != 'true'
        run: tar -cf "build-state-$RUNNER_OS-$RUNNER_ARCH.tar" target
      - name: upload build state
        if: *state-wanted
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build-state-${{ runner.os }}-${{ runner.arch }}.tar
          archive: false
          retention-days: 1

  # Promotes the landed commit's merge-group build state into main's cache.
  promote:
    if: github.event_name == 'push'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: state
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: ci.yml
          commit: ${{ github.sha }}
          event: merge_group
          workflow_conclusion: ""
          name: build-state-${{ runner.os }}-${{ runner.arch }}.tar
          if_no_artifact_found: ignore
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: probe-raw
          cache-workspace-crates: true
          save-if: ${{ steps.state.outputs.found_artifact == 'true' }}
      - name: show the download
        run: ls -la
      - name: unpack build state
        if: steps.state.outputs.found_artifact == 'true'
        run: tar -xf "build-state-$RUNNER_OS-$RUNNER_ARCH.tar"
      - name: fetch the locked registry
        if: steps.state.outputs.found_artifact == 'true'
        run: cargo fetch --locked
